<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2NK เวรวันเสาร์</title>
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#121212; --s1:#1A1A1A; --s2:#212121; --s3:#2A2A2A; --line:#2E2E2E; --line2:#3A3A3A;
  --txt:#EDE6DA; --txt2:#B9B2A6; --mut:#7E776C;
  --gold:#B08D57; --gold2:#C9A46A; --goldbg:rgba(176,141,87,.14); --goldline:rgba(176,141,87,.45);
  --ok:#6FB58A; --okbg:rgba(111,181,138,.13); --warn:#D9A54A; --warnbg:rgba(217,165,74,.14);
  --bad:#D9776A; --badbg:rgba(217,119,106,.14); --sub:#A79BE0; --subbg:rgba(167,155,224,.14);
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Inter','IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
i.ti{font-size:18px;line-height:1;vertical-align:-3px}
.top{position:sticky;top:0;z-index:20;background:rgba(18,18,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:.3px;white-space:nowrap}
.mark{width:30px;height:30px;border:1px solid var(--gold);color:var(--gold);border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:.5px}
.logo small{color:var(--mut);font-weight:400;font-size:12px;display:block;letter-spacing:1.5px;text-transform:uppercase}
.sp{flex:1}
nav.tabs{display:flex;gap:2px}
nav.tabs button{background:none;border:0;color:var(--txt2);padding:8px 14px;border-radius:8px;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap}
nav.tabs button:hover{background:var(--s2)}
nav.tabs button.on{color:var(--gold2);background:var(--goldbg)}
.acct{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;color:var(--txt)}
.acct .av{width:28px;height:28px;font-size:12px}
main{max-width:1240px;margin:0 auto;padding:18px 16px 110px}
h2{font-size:15px;font-weight:600;margin:0 0 12px;letter-spacing:.2px}
.eyebrow{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);font-weight:500}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--mut)} .t2{color:var(--txt2)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--s2);color:var(--txt);border-radius:9px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{border-color:var(--mut)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16120C}
.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:none;border-color:transparent;color:var(--txt2)}
.btn.danger{color:var(--bad);border-color:rgba(217,119,106,.4);background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;color:var(--txt2);padding:6px 12px;border-radius:7px;font-size:13px;font-weight:500}
.seg button.on{background:var(--s3);color:var(--gold2)}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--s3);color:var(--gold2);border:1px solid var(--line2)}
.av.g2{color:#9CC7C0} .av.g0{color:#C9A0C9}
.st{flex:none;font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;white-space:nowrap;border:1px solid transparent}
.s-present,.s-sub{background:var(--okbg);color:var(--ok)}
.s-wait{background:var(--warnbg);color:var(--warn)}
.s-future,.s-noscan,.s-cancelled{background:var(--s3);color:var(--mut)}
.s-open{background:var(--warnbg);color:var(--warn);border-color:rgba(217,165,74,.5)}
.s-absent,.s-subabsent{background:var(--badbg);color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--s3);color:var(--txt2)}
.tag.gold{background:var(--goldbg);color:var(--gold2)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.sub{background:var(--subbg);color:var(--sub)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.banner{display:flex;gap:12px;align-items:center;border:1px solid var(--goldline);background:linear-gradient(90deg,var(--goldbg),transparent);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.banner .t{flex:1}
/* layout หน้าแรก */
.home{display:grid;gap:16px}
@media (min-width:980px){ .home{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start} .detail{position:sticky;top:76px} }
/* ปฏิทิน */
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.calhead .m{font-size:20px;font-weight:600;letter-spacing:.2px}
.calhead .y{color:var(--mut);font-weight:400}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--s2);display:grid;place-items:center;color:var(--txt2)}
.iconbtn:hover{color:var(--txt);border-color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:11.5px;color:var(--mut);text-align:center;padding:2px 0 6px;letter-spacing:.5px}
.dow.sat{color:var(--gold)}
.cell{position:relative;min-height:86px;border-radius:10px;border:1px solid var(--line);background:var(--s1);padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--txt2)}
.cell.out{opacity:.28}
.cell .n{font-size:13px;font-weight:500}
.cell.today .n{color:#16120C;background:var(--txt);border-radius:99px;width:24px;height:24px;display:grid;place-items:center;margin:-3px 0 0 -4px}
.cell.duty{background:var(--s2);border-color:var(--line2);color:var(--txt);cursor:pointer}
.cell.duty:hover{border-color:var(--gold)}
.cell.duty .n{color:var(--gold2)}
.cell.duty.today .n{color:#16120C;background:var(--gold2)}
.cell.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:var(--goldbg)}
.cell.mine::after{content:'';position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--gold2)}
.cell.cancel{cursor:pointer}
.cell .cnt{font-size:11.5px;color:var(--txt2);display:flex;align-items:center;gap:4px}
.cell .marks{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.dot{font-size:10.5px;border-radius:5px;padding:1px 5px;font-weight:500;white-space:nowrap}
.dot.all{background:var(--goldbg);color:var(--gold2)}
.dot.sub{background:var(--subbg);color:var(--sub)}
.dot.open{background:var(--warnbg);color:var(--warn)}
.dot.bad{background:var(--badbg);color:var(--bad)}
.dot.x{background:var(--s3);color:var(--mut)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}
@media (max-width:640px){
  .cal{gap:4px}
  .cell{min-height:58px;padding:5px;border-radius:8px;align-items:center;text-align:center}
  .cell .cnt{display:none}
  .cell .marks{justify-content:center;margin-top:auto}
  .dot{font-size:0;width:6px;height:6px;padding:0;border-radius:50%}
  .dot.all{background:var(--gold2)} .dot.sub{background:var(--sub)} .dot.open{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.x{background:var(--mut)}
  .cell.mine::after{top:4px;right:4px;width:5px;height:5px}
  .cell.today .n{margin:0}
}
/* รายละเอียดวัน */
.dhead .d{font-size:19px;font-weight:600}
.people{display:grid;gap:8px;margin-top:14px}
.p{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--s2);width:100%;text-align:left;color:var(--txt)}
.p:hover{border-color:var(--line2)}
.p.mine{border-color:var(--goldline)}
.pn{flex:1;min-width:0}
.pn .n{font-weight:500}
.pn .s{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere;margin-top:1px}
.pn .s s{color:var(--mut)}
.subtag{color:var(--sub);font-size:11.5px;font-weight:500;margin-left:6px}
.grp{font-size:11.5px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin:14px 0 -4px}
/* ตาราง */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12px;color:var(--mut);font-weight:500;letter-spacing:.3px;background:var(--s1);position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--s2)}
.tablewrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line)}
.num0{color:#4A4740}
.hist{display:grid;gap:8px}
.h{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--s1);border:1px solid var(--line)}
.h .w{flex:1;min-width:0}
.h .m{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere;margin-top:2px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:34px;opacity:.8}
/* ฟอร์ม */
label.f{display:block;font-size:12.5px;color:var(--txt2);margin:12px 0 5px;font-weight:500}
.in{width:100%;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;background:var(--bg);color:var(--txt)}
.in::placeholder{color:#5C574F}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--goldbg)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--txt2);margin-top:12px}
.chk input{accent-color:var(--gold);width:16px;height:16px}
/* login */
.login{min-height:calc(100dvh - 80px);display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:380px}
.login .mark{width:52px;height:52px;font-size:15px;border-radius:12px;margin-bottom:18px}
.login h1{font-size:22px;font-weight:600;margin:0 0 4px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--s1);border:1px solid var(--line2);width:100%;max-width:560px;max-height:92dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet header{padding:16px 18px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:16px;font-weight:600;flex:1}
.sheet .body{padding:14px 18px;overflow-y:auto;flex:1}
.sheet footer{padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;border-top:1px solid var(--line)}
.sheet footer .btn{flex:1;padding:11px}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--s2);text-align:left;width:100%;color:var(--txt)}
.opt.on{border-color:var(--gold);background:var(--goldbg)}
.opt .c{margin-left:auto;font-size:12px;color:var(--mut);text-align:right}
.warnline{color:var(--warn);font-size:12px}
.menu{position:absolute;right:16px;top:58px;background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:230px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--txt);text-align:left}
.menu button:hover{background:var(--s3)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);background:var(--s3);border:1px solid var(--line2);color:var(--txt);padding:10px 16px;border-radius:10px;z-index:80;max-width:92vw;font-size:14px}
.toast.err{border-color:rgba(217,119,106,.6);color:var(--bad)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--mut)}
.spin{width:26px;height:26px;border:2px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.staffrow td{text-align:left}
.pill{font-size:11px;border-radius:5px;padding:1px 6px;border:1px solid var(--line2);color:var(--txt2)}
.pill.gold{border-color:var(--goldline);color:var(--gold2)}

.av.gx{color:#7FB7D9}
.dot.xtra{background:rgba(127,183,217,.14);color:#7FB7D9}
.tag.xtra{background:rgba(127,183,217,.14);color:#7FB7D9}
.tag.hol{background:rgba(224,139,122,.13);color:#E08B7A}
.legend .dot{display:inline-block;width:10px;height:10px;padding:0;border-radius:3px;font-size:0}
.legend .dot.all{background:var(--gold2)} .legend .dot.xtra{background:#7FB7D9} .legend .dot.sub{background:var(--sub)}
.legend .dot.open{background:var(--warn)} .legend .dot.bad{background:var(--bad)} .legend .dot.hd{background:#E08B7A} .legend .dot.me{background:var(--gold2);border-radius:50%;width:8px;height:8px}
.cell .hol{font-size:10.5px;color:#E08B7A;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cell.obs .hol{color:var(--mut)}
.cell.holiday{border-color:rgba(224,139,122,.35)}
.cell.holiday .n{color:#E08B7A}
.cell.holiday.duty .n{color:var(--gold2)}
.search{position:relative}
.search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search .in{padding-left:34px}
.mono{font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.metric{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric .v{font-size:22px;font-weight:600;margin-top:2px}
table.report td{vertical-align:top}
table.report tr.first td{border-top:1px solid var(--line2)}
.rp{position:relative}
.rppop{position:absolute;right:0;top:44px;z-index:45;background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:12px;width:300px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.rpcal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.rpcal button{border:0;background:none;color:var(--txt2);padding:7px 0;border-radius:6px;font-size:13px;position:relative}
.rpcal button:hover{background:var(--s3)}
.rpcal button.o{opacity:.35}
.rpcal button.du::after{content:'';position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.rpcal button.in{background:var(--goldbg);color:var(--txt)}
.rpcal button.edge{background:var(--gold);color:#16120C}
@media (max-width:640px){ .cell .hol{display:none} .rppop{right:auto;left:0;width:min(300px,calc(100vw - 32px))} }
/* มือถือ */
@media (max-width:899px){
  .top{backdrop-filter:none;background:var(--bg)}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,18,18,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);justify-content:space-around}
  nav.tabs button{flex-direction:column;gap:3px;font-size:11.5px;padding:6px 4px;flex:1}
  nav.tabs button i.ti{font-size:21px}
  nav.tabs button.on{background:none}
  .acct .nm{display:none} .acct{padding:4px}
  .logo small{display:none}
}
@media (min-width:900px){
  .ov{align-items:center}
  .sheet{border-radius:16px;max-height:86vh}
}
</style>
</head>
<body>
<div class="top" id="top" style="display:none">
  <div class="topin">
    <div class="logo"><div class="mark">2NK</div><div>Duty Roster<small>เวรวันเสาร์</small></div></div>
    <div class="sp"></div>
    <nav class="tabs" id="tabs"></nav>
    <button class="acct" id="acctBtn" onclick="toggleMenu(event)"><div class="av" id="acctAv">?</div><span class="nm" id="acctNm"></span><i class="ti ti-chevron-down muted nm"></i></button>
  </div>
</div>
<main id="app"><div class="loading"><div><div class="spin"></div>กำลังโหลด…</div></div></main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxOacNTG4tGdFwtELxqvnEA-kjo1rDqyAWKIXm6z89foVDzj3k6Y1ugJE3Ut9rSFdY/exec";
const PAGE_VERSION = '2026-10-27.2';

/* ---------- ตัวเรียกเซิร์ฟเวอร์ ---------- */
function call(fn, ...args){
  if (window.google && google.script && google.script.run){
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res)
      .withFailureHandler(e => rej(new Error((e && e.message) || e)))[fn](...args));
  }
  if (API_URL){
    return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args})})
      .then(r => r.json()).then(j => { if (j.error) throw new Error(j.error); return j.result; });
  }
  if (window.LOCAL_API){
    return new Promise((res, rej) => setTimeout(() => {
      try { res(JSON.parse(JSON.stringify(window.LOCAL_API[fn](...args)))); } catch(e){ rej(e); }
    }, 120));
  }
  return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL'));
}
/* เรียกพร้อม token; หมดอายุ → กลับหน้าเข้าสู่ระบบ */
function api(fn, ...args){
  return call(fn, S.token, ...args).catch(e => {
    if (e && e.message === 'AUTH'){ setToken('', false); showLogin('เซสชันหมดอายุ เข้าสู่ระบบอีกครั้ง'); throw new Error('เซสชันหมดอายุ'); }
    throw e;
  });
}

/* ---------- สถานะ ---------- */
const store = {
  get(k){ try { return localStorage.getItem('duty.' + k) || sessionStorage.getItem('duty.' + k) || ''; } catch(e){ return ''; } },
  set(k, v, keep){ try { localStorage.removeItem('duty.' + k); sessionStorage.removeItem('duty.' + k); if (v) (keep ? localStorage : sessionStorage).setItem('duty.' + k, v); } catch(e){} }
};
const S = {
  token: store.get('token'), data: null, tab: 'cal', month: '', sel: '',
  statRange: 'year', person: '', histFilter: 'active', staffEdit: null
};
function setToken(t, keep){ S.token = t; store.set('token', t, keep); }

const STATUS = {
  present:  ['มาแล้ว', 's-present'],
  sub:      ['มาแทนแล้ว', 's-sub'],
  wait:     ['รอสแกน', 's-wait'],
  future:   ['รอวันเวร', 's-future'],
  open:     ['หาคนแทน', 's-open'],
  absent:   ['ขาด', 's-absent'],
  subabsent:['คนแทนไม่มา', 's-subabsent'],
  noscan:   ['ไม่มีข้อมูลสแกน', 's-noscan'],
  cancelled:['ยกเลิกเวร', 's-cancelled']
};

/* ---------- วันที่ ---------- */
const TH_DAY = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TH_DAY_FULL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const pad = n => String(n).padStart(2, '0');
function pd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtDate(s, full){
  const d = pd(s);
  return (full ? 'วัน' + TH_DAY_FULL[d.getDay()] + 'ที่ ' : TH_DAY[d.getDay()] + ' ') + d.getDate() + ' ' + (full ? TH_MON_FULL : TH_MON)[d.getMonth()] + ' ' + d.getFullYear();
}
function daysBetween(a, b){ return Math.round((pd(b) - pd(a)) / 86400000); }
function relDay(s){
  const n = daysBetween(S.data.today, s);
  if (n === 0) return 'วันนี้';
  if (n === 1) return 'พรุ่งนี้';
  if (n > 1) return 'อีก ' + n + ' วัน';
  if (n === -1) return 'เมื่อวาน';
  return n * -1 + ' วันที่แล้ว';
}

/* ---------- ตัวช่วย ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 4500 : 2600);
}
const errMsg = e => (e && e.message) || String(e);
function initial(n){ const m = String(n || '').replace(/^พี่/, '').match(/[ก-ฮA-Za-z0-9]/); return esc(m ? m[0].toUpperCase() : '?'); }
const ME = () => S.data && S.data.me;
const isAdmin = () => !!(ME() && ME().admin);
const isMine = p => ME() && (p.owner === ME().nick || p.actual === ME().nick);

/* ---------- เข้าสู่ระบบ ---------- */
function showLogin(msg){
  S.data = null;
  $('top').style.display = 'none';
  closeMenu();
  document.querySelectorAll('.ov').forEach(o => o.remove());
  $('app').innerHTML = `<div class="login"><div class="box">
    <div class="mark">2NK<\/div>
    <div class="eyebrow">Duty Roster<\/div>
    <h1>เข้าสู่ระบบเวรวันเสาร์<\/h1>
    <div class="muted small">ใช้ Username และรหัสผ่านที่ได้รับจากผู้ดูแล<\/div>
    <form onsubmit="doLogin(event)" style="margin-top:22px">
      <label class="f">Username<\/label>
      <input class="in" id="lgU" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <label class="f">รหัสผ่าน<\/label>
      <input class="in" id="lgP" type="password" autocomplete="current-password" required>
      <label class="chk"><input type="checkbox" id="lgR" checked> จดจำการเข้าสู่ระบบในเครื่องนี้ (30 วัน)<\/label>
      <button class="btn gold" id="lgBtn" style="width:100%;margin-top:18px;padding:12px">เข้าสู่ระบบ<\/button>
      <div class="err" id="lgErr">${esc(msg || '')}<\/div>

function doLogin(ev){
  ev.preventDefault();
  const b = $('lgBtn'); b.disabled = true; b.textContent = 'กำลังตรวจสอบ…';
  $('lgErr').textContent = '';
  call('login', $('lgU').value.trim(), $('lgP').value, $('lgR').checked).then(r => {
    setToken(r.token, $('lgR').checked);
    $('app').innerHTML = '<div class="loading"><div><div class="spin"><\/div>กำลังโหลด…<\/div><\/div>';
    load();
  }).catch(e => { b.disabled = false; b.textContent = 'เข้าสู่ระบบ'; $('lgErr').textContent = errMsg(e); });
}
function doLogout(){
  const t = S.token;
  setToken('', false);
  call('logout', t).catch(() => {});
  showLogin();
}

/* ---------- โหลดข้อมูล ---------- */
let loading = false;
function load(quiet){
  if (!S.token) return showLogin();
  if (loading) return Promise.resolve();
  loading = true;
  return api('getData').then(d => {
    S.data = d;
    if (!S.month || !S.sel){
      const nx = nextDay();
      S.sel = S.sel || (nx ? nx.date : d.today);
      S.month = S.month || (S.sel || d.today).slice(0, 7);
    }
    $('top').style.display = '';
    if (!modalOpen()) render();
  }).catch(e => {
    if (!S.token) return;
    if (!quiet || !S.data) $('app').innerHTML = `<div class="card empty" style="max-width:420px;margin:60px auto"><b>โหลดข้อมูลไม่ได้<\/b><br>${esc(errMsg(e))}<br><br><button class="btn gold" onclick="load()">ลองใหม่<\/button><\/div>`;
  }).finally(() => { loading = false; });
}
setInterval(() => { if (document.visibilityState === 'visible' && S.data && !modalOpen()) load(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.data) load(true); });

/* ---------- ข้อมูลที่ใช้บ่อย ---------- */
function upcoming(){ return S.data.days.filter(d => d.date >= S.data.today); }
function nextDay(){ return (S.data.days || []).filter(d => d.date >= S.data.today && !d.cancelled && d.people.length)[0]; }
function dayOf(date){ return S.data.days.find(d => d.date === date); }
function myDuties(){ return upcoming().filter(d => !d.cancelled && d.people.some(isMine)); }
function activeStaff(){ return S.data.staff.filter(s => s.active && !s.adminOnly); }

/* ---------- เมนูบัญชี ---------- */
function toggleMenu(ev){

document.addEventListener('click', closeMenu);

/* ---------- แท็บ ---------- */
function tabs(){

function footer(){

  return `<div class="foot">ดึงแพลนจากไฟล์ต้นฉบับล่าสุด ${esc(sync)} · หน้าเว็บ ${PAGE_VERSION} · เซิร์ฟเวอร์ ${esc(d.version)}<\/div>`;
}

/* ---------- ปฏิทิน (หน้าแรก) ---------- */
function viewCal(){
  const mine = myDuties();
  let banner = '';
  if (mine.length){
    const m = mine[0];
    const p = m.people.find(isMine);
    const isSub = p.actual === ME().nick && p.owner !== ME().nick;
    const gave = p.owner === ME().nick && p.actual && p.actual !== ME().nick;
    banner = `<div class="banner"><i class="ti ti-calendar-star" style="font-size:22px;color:var(--gold2)"><\/i><div class="t">
      <div class="eyebrow" style="color:var(--gold)">${isSub ? 'คุณรับแทนเวร' : (gave ? 'เวรของคุณมีคนแทนแล้ว' : 'เวรถัดไปของคุณ')}<\/div>
      <div style="margin-top:2px"><b>${fmtDate(m.date, true)}<\/b> <span class="muted">· ${relDay(m.date)}<\/span>${isSub ? ' · แทน ' + esc(p.owner) : ''}${gave ? ' · ' + esc(p.actual) + ' มาแทน' : ''}${p.status === 'open' ? ' · <span style="color:var(--warn)">ยังหาคนแทนไม่ได้<\/span>' : ''}<\/div><\/div>
      <button class="btn sm" onclick="pickDay('${m.date}')">ดูรายละเอียด<\/button><\/div>`;
  }
  const opens = [];
  upcoming().forEach(day => day.people.forEach(p => { if (p.status === 'open') opens.push([day, p]); }));
  const openBox = opens.length ? `<div class="card" style="margin-top:16px;border-color:rgba(217,165,74,.4)"><h2><i class="ti ti-hand-stop" style="color:var(--warn)"><\/i> ต้องการคนแทน (${opens.length})<\/h2>
    <div class="hist">${opens.map(([day, p]) => `<div class="h" style="background:var(--s2)"><div class="w"><b>${fmtDate(day.date)}<\/b> · ${esc(p.owner)} มาไม่ได้${p.swap.reason ? '<div class="m">' + esc(p.swap.reason) + '<\/div>' : ''}<\/div>
      <button class="btn gold sm" onclick="openTake('${p.swap.id}')">ฉันไปแทนเอง<\/button><\/div>`).join('')}<\/div><\/div>` : '';
  return `${banner}<div class="home"><div><div class="card">${calendar()}<\/div>${openBox}<\/div><div class="detail" id="detail">${detailPanel()}<\/div><\/div>`;
}
function holsOf(k){ return (S.data.holidays || []).filter(h => h.date === k); }
function calendar(){
  const [y, m] = S.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const map = {}, hol = {};
  S.data.days.forEach(d => { map[d.date] = d; });
  (S.data.holidays || []).forEach(h => { (hol[h.date] = hol[h.date] || []).push(h); });
  const cells = [];
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    const k = ymd(d), day = map[k], out = d.getMonth() !== m - 1, hs = hol[k] || [];
    const cls = ['cell'];
    if (out) cls.push('out');
    if (k === S.data.today) cls.push('today');
    if (k === S.sel) cls.push('sel');
    const realHol = hs.filter(h => h.type !== 'วันสำคัญ');
    if (realHol.length) cls.push('holiday'); else if (hs.length) cls.push('obs');
    let inner = `<span class="n">${d.getDate()}<\/span>`;
    if (hs.length) inner += `<span class="hol" title="${esc(hs.map(h => h.name).join(', '))}">${esc((realHol[0] || hs[0]).name)}<\/span>`;
    if (day){
      cls.push(day.cancelled ? 'cancel' : 'duty');
      if (!day.cancelled && day.people.some(isMine)) cls.push('mine');
      const subs = day.people.filter(p => p.swap && p.swap.status === 'แทนแล้ว').length;
      const open = day.people.filter(p => p.status === 'open').length;
      const bad = day.people.filter(p => p.status === 'absent' || p.status === 'subabsent').length;
      const xtra = day.people.filter(p => p.group === 'x').length;
      const marks = day.cancelled ? '<span class="dot x">ยกเลิก<\/span>' :
        (day.all ? '<span class="dot all">ทั้งหมด<\/span>' : '') + (xtra ? `<span class="dot xtra">เพิ่ม ${xtra}<\/span>` : '') +
        (subs ? `<span class="dot sub">แทน ${subs}<\/span>` : '') + (open ? `<span class="dot open">หาคน ${open}<\/span>` : '') + (bad ? `<span class="dot bad">ขาด ${bad}<\/span>` : '');
      inner += (day.people.length && !day.cancelled ? `<span class="cnt"><i class="ti ti-users" style="font-size:13px"><\/i>${day.people.length} คน<\/span>` : '') + `<span class="marks">${marks}<\/span>`;
    }
    cells.push(`<button class="${cls.join(' ')}" onclick="pickDay('${k}')">${inner}<\/button>`);
  }
  const dows = ['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'].map((x, i) => `<div class="dow${i === 5 ? ' sat' : ''}">${x}<\/div>`).join('');
  return `<div class="calhead">
      <div class="m">${TH_MON_FULL[m - 1]} <span class="y">${y}<\/span><\/div><div class="sp"><\/div>
      <button class="btn sm ghost" onclick="calToday()">วันนี้<\/button>
      <button class="iconbtn" aria-label="เดือนก่อน" onclick="calMove(-1)"><i class="ti ti-chevron-left"><\/i><\/button>
      <button class="iconbtn" aria-label="เดือนถัดไป" onclick="calMove(1)"><i class="ti ti-chevron-right"><\/i><\/button>
    <\/div>
    <div class="cal">${dows}${cells.join('')}<\/div>
    <div class="legend"><span><span class="dot all"><\/span>เข้าทั้งหมด<\/span><span><span class="dot xtra"><\/span>เวรเพิ่ม<\/span><span><span class="dot sub"><\/span>มีคนแทน<\/span><span><span class="dot open"><\/span>หาคนแทน<\/span><span><span class="dot bad"><\/span>ขาด<\/span><span><span class="dot hd"><\/span>วันหยุดราชการ<\/span><span><span class="dot me"><\/span>เวรของคุณ<\/span><\/div>`;
}
function calMove(n){ const [y, m] = S.month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); S.month = d.getFullYear() + '-' + pad(d.getMonth() + 1); render(); }
function calToday(){ S.month = S.data.today.slice(0, 7); const nx = nextDay(); S.sel = nx ? nx.date : S.data.today; render(); }
function pickDay(k){
  S.sel = k; S.month = k.slice(0, 7);
  if (S.tab !== 'cal') S.tab = 'cal';
  render();
  if (window.innerWidth < 980){ const el = $('detail'); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
}

const GROUP_NAME = {'0':'ฝ่ายอื่น', '1':'กลุ่ม 1', '2':'กลุ่ม 2', 'x':'เวรเพิ่ม'};
const avCls = g => g === '2' ? ' g2' : (g === '0' ? ' g0' : (g === 'x' ? ' gx' : ''));
function personRow(day, p){
  const st = STATUS[p.status] || ['', ''];
  let name, sub;
  if (p.swap && p.swap.status === 'แทนแล้ว'){
    name = `${esc(p.actual)}<span class="subtag"><i class="ti ti-arrows-exchange" style="font-size:13px"><\/i> แทน<\/span>`;
    sub = `เจ้าของเวร <s>${esc(p.owner)}<\/s>${p.swap.reason ? ' · ' + esc(p.swap.reason) : ''}`;
  } else if (p.status === 'open'){
    name = esc(p.owner);
    sub = `แจ้งไม่มา ยังไม่มีคนแทน${p.swap.reason ? ' · ' + esc(p.swap.reason) : ''}`;
  } else { name = esc(p.owner); sub = ''; }
  if (p.scan && p.scan.in) sub += (sub ? ' · ' : '') + `สแกน ${esc(p.scan.in)}${p.scan.out ? '–' + esc(p.scan.out) : ''}`;
  return `<button class="p${isMine(p) ? ' mine' : ''}" onclick="openPerson('${day.date}','${esc(p.owner)}')">
    <div class="av${avCls(p.group)}">${initial(p.actual || p.owner)}<\/div>
    <div class="pn"><div class="n">${name}<\/div>${sub ? `<div class="s">${sub}<\/div>` : ''}<\/div>
    <span class="st ${st[1]}">${st[0]}<\/span><\/button>`;
}
function detailPanel(){
  const k = S.sel;
  if (!k) return `<div class="card empty"><i class="ti ti-calendar" style="font-size:28px"><\/i><br>เลือกวันในปฏิทิน<\/div>`;
  const day = dayOf(k), hs = holsOf(k);
  const people = day ? day.people : [];
  const subs = people.filter(p => p.swap && p.swap.status === 'แทนแล้ว').length;
  const open = people.filter(p => p.status === 'open').length;
  const groups = {};
  people.forEach(p => { (groups[p.group] = groups[p.group] || []).push(p); });
  const order = ['1', '2', '0', 'x'];
  const keys = Object.keys(groups).sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const multi = keys.length > 1 || keys[0] === 'x';
  const list = keys.map(g => (multi ? `<div class="grp">${GROUP_NAME[g] || 'กลุ่ม ' + esc(g)}<\/div>` : '') + groups[g].map(p => personRow(day, p)).join('')).join('');
  const addBtn = isAdmin() ? `<button class="btn sm${people.length ? '' : ' gold'}" style="margin-top:14px" onclick="openExtra('${k}')"><i class="ti ti-user-plus"><\/i>เพิ่มคนเข้าทำงานวันนี้<\/button>` : '';
  return `<div class="card">
    <div class="dhead"><div class="eyebrow">${relDay(k)}${day && day.dept ? ' · ' + esc(day.dept) : ''}<\/div>
      <div class="d" style="margin-top:4px">${fmtDate(k, true)}<\/div>
      <div class="row" style="margin-top:10px">
        ${hs.map(h => `<span class="tag ${h.type === 'วันสำคัญ' ? '' : 'hol'}"><i class="ti ti-flag" style="font-size:14px"><\/i>${esc(h.name)}<\/span>`).join('')}
        ${day && day.cancelled ? '<span class="tag bad">ยกเลิกเวร<\/span>' : (people.length ? `<span class="tag"><i class="ti ti-users" style="font-size:14px"><\/i>${people.length} คน<\/span>` : '')}
        ${day && day.all ? '<span class="tag gold">เข้าทั้งหมด<\/span>' : ''}
        ${subs ? `<span class="tag sub">มีคนแทน ${subs}<\/span>` : ''}
        ${open ? `<span class="tag warn">หาคนแทน ${open}<\/span>` : ''}
        ${day && day.hasScan ? '<span class="tag"><i class="ti ti-fingerprint" style="font-size:14px"><\/i>มีข้อมูลสแกน<\/span>' : ''}
      <\/div>
      ${day && day.note ? `<div class="small t2" style="margin-top:10px"><i class="ti ti-note" style="font-size:15px"><\/i> ${esc(day.note)}<\/div>` : ''}
    <\/div>
    ${people.length ? `<div class="people">${list}<\/div>` : `<div class="muted" style="margin-top:14px">${day && day.cancelled ? 'วันนี้ยกเลิกเวร' : 'วันนี้ไม่มีเวร'}<\/div>`}
    ${people.length && k >= S.data.today ? '<div class="muted small" style="margin-top:12px">กดที่ชื่อเพื่อแจ้งมาไม่ได้ / หาคนแทน / ดูรายละเอียด<\/div>' : ''}
    ${addBtn}
  <\/div>`;
}

/* เพิ่มคนเข้าทำงาน (ผู้ดูแล) */
let XPICK = new Set();
function openExtra(date){
  const day = dayOf(date);
  const busy = new Set();
  if (day) day.people.forEach(p => { busy.add(p.owner); if (p.actual) busy.add(p.actual); });
  const y = date.slice(0, 4), load = {};
  S.data.days.forEach(d => { if (!d.cancelled && d.date.slice(0, 4) === y) d.people.forEach(p => { if (p.actual) load[p.actual] = (load[p.actual] || 0) + 1; }); });
  const cs = activeStaff().filter(s => !busy.has(s.nick)).sort((a, b) => (load[a.nick] || 0) - (load[b.nick] || 0) || a.nick.localeCompare(b.nick, 'th'));
  XPICK = new Set();
  const hs = holsOf(date);
  modal('เพิ่มคนเข้าทำงาน', `<div style="font-weight:600">${fmtDate(date, true)}<\/div>
    ${hs.length ? `<div class="small" style="color:#E08B7A;margin-top:2px">${esc(hs.map(h => h.name).join(', '))}<\/div>` : ''}
    <label class="f">หมายเหตุ (ไม่บังคับ)<\/label><input class="in" id="xNote" maxlength="200" placeholder="เข้าทำงานเพิ่ม โปร 11.11">

/* ---------- สรุปรายคน ---------- */
function statRange(){
  const t = S.data.today, y = t.slice(0, 4), m = t.slice(0, 7);
  if (S.statRange === 'month') return [m + '-01', m + '-31', 'เดือนนี้'];
  if (S.statRange === 'prev'){ const d = pd(m + '-01'); d.setMonth(d.getMonth() - 1);
    const pm = d.getFullYear() + '-' + pad(d.getMonth() + 1); return [pm + '-01', pm + '-31', 'เดือนก่อน']; }
  if (S.statRange === 'all') return ['0000', '9999', 'ทั้งหมด'];
  return [y + '-01-01', y + '-12-31', 'ปี ' + y];
}
function computeStats(from, to){
  const st = {};
  const get = n => st[n] || (st[n] = {nick: n, plan: 0, gave: 0, covered: 0, came: 0, absent: 0, nodata: 0, upcoming: 0, rows: []});
  S.data.days.forEach(d => {
    if (d.date < from || d.date > to || d.cancelled) return;
    d.people.forEach(p => {
      const o = get(p.owner);
      o.plan++;
      o.rows.push({d, p, role: p.actual === p.owner ? 'own' : 'gave'});
      if (p.swap && p.swap.status === 'แทนแล้ว') o.gave++;
      if (p.actual && p.actual !== p.owner){ const s = get(p.actual); s.covered++; s.rows.push({d, p, role: 'sub'}); }
      if (p.actual){
        const a = get(p.actual);
        if (p.status === 'present' || p.status === 'sub') a.came++;
        else if (p.status === 'absent' || p.status === 'subabsent') a.absent++;
        else if (p.status === 'noscan') a.nodata++;
        else if (p.status === 'future' || p.status === 'wait') a.upcoming++;
      }
    });
  });
  activeStaff().forEach(s => get(s.nick));
  return Object.values(st).sort((a, b) => (b.plan + b.covered) - (a.plan + a.covered) || a.nick.localeCompare(b.nick, 'th'));
}
function viewStats(){
  const [from, to, label] = statRange();

  const ranges = [['year','ปีนี้'],['month','เดือนนี้'],['prev','เดือนก่อน'],['all','ทั้งหมด']];

  if (S.person){
    const r = rows.find(x => x.nick === S.person);
    if (r){
      const ord = r.rows.slice().sort((a, b) => b.d.date.localeCompare(a.d.date));

        const st = STATUS[x.p.status] || ['', ''];

        const shown = x.role === 'gave' ? '' : `<span class="st ${st[1]}">${st[0]}<\/span>`;
        return `<div class="h" style="cursor:pointer" onclick="pickDay('${x.d.date}')"><div class="w"><b>${fmtDate(x.d.date)}<\/b><div class="m">${role}${x.p.scan && x.p.scan.in && x.role !== 'gave' ? ' · สแกน ' + esc(x.p.scan.in) : ''}<\/div><\/div>${shown}<\/div>`;
      }).join('') || '<div class="card empty">ไม่มีรายการ<\/div>'}<\/div>`;

  }
  return `<div class="row" style="justify-content:space-between;margin-bottom:14px"><div><div class="eyebrow">สรุปรายคน<\/div><div style="font-size:19px;font-weight:600;margin-top:2px">${label}<\/div><\/div>
      <div class="seg">${ranges.map(r => `<button class="${S.statRange === r[0] ? 'on' : ''}" onclick="S.statRange='${r[0]}';render()">${r[1]}<\/button>`).join('')}<\/div><\/div>
    <div class="tablewrap"><table>
      <thead><tr><th>ชื่อ<\/th><th>เวรตามแพลน<\/th><th>ให้คนอื่นแทน<\/th><th>ไปแทนคนอื่น<\/th><th>มาแล้ว<\/th><th>ขาด<\/th><th>รอวันเวร<\/th><th>ไม่มีข้อมูลสแกน<\/th><\/tr><\/thead>
      <tbody>${rows.map(r => `<tr onclick="S.person='${esc(r.nick)}';render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30)" style="${S.person === r.nick ? 'background:var(--goldbg)' : ''}">
        <td><b style="font-weight:500">${esc(r.nick)}<\/b><\/td><td>${n(r.plan)}<\/td><td>${n(r.gave)}<\/td><td>${n(r.covered)}<\/td>
        <td style="color:var(--ok)">${n(r.came)}<\/td><td style="color:var(--bad)">${n(r.absent)}<\/td><td>${n(r.upcoming)}<\/td><td>${n(r.nodata)}<\/td><\/tr>`).join('')}<\/tbody>
    <\/table><\/div>
    <div class="muted small" style="margin-top:8px">กดที่ชื่อเพื่อดูรายละเอียด · "ขาด" นับเฉพาะวันที่มีข้อมูลสแกนนิ้วแล้วแต่ไม่พบคนนั้น<\/div>

/* ---------- สรุปการเข้าเวร (ตรวจสอบย้อนหลัง) ---------- */
function monthRange(off){
  const t = pd(S.data.today); const a = new Date(t.getFullYear(), t.getMonth() + off, 1); const b = new Date(t.getFullYear(), t.getMonth() + off + 1, 0);
  return [ymd(a), ymd(b)];
}
function rInit(){ if (!S.rFrom){ const [a, b] = monthRange(0); S.rFrom = a; S.rTo = b; } }
function reportRows(){
  rInit();
  const q = (S.rQ || '').trim();
  const rows = [];
  S.data.days.forEach(d => {
    if (d.date < S.rFrom || d.date > S.rTo || d.cancelled) return;
    d.people.forEach(p => {
      const who = p.actual || '';
      const type = p.group === 'x' ? 'เวรเพิ่ม' : (p.swap && p.swap.status === 'แทนแล้ว' ? 'มาแทน' : (p.status === 'open' ? 'แจ้งไม่มา' : 'ตามแพลน'));
      if (q && (who + ' ' + p.owner).indexOf(q) < 0) return;
      rows.push({d, p, who, type});
    });
  });
  return rows;
}
function fmtShort(s){ const d = pd(s); return d.getDate() + ' ' + TH_MON[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2); }
function viewReport(){

      <td><span class="tag ${r.type === 'มาแทน' ? 'sub' : (r.type === 'เวรเพิ่ม' ? 'xtra' : (r.type === 'แจ้งไม่มา' ? 'warn' : ''))}">${r.type}<\/span><\/td>

function rRefresh(){
  const pos = $('rQ').selectionStart;
  render();
  const el = $('rQ'); if (el){ el.focus(); el.setSelectionRange(pos, pos); }
}
function rQuick(k){
  const t = pd(S.data.today);
  if (k === 'm0') [S.rFrom, S.rTo] = monthRange(0);
  else if (k === 'm-1') [S.rFrom, S.rTo] = monthRange(-1);
  else if (k === 'm3'){ S.rFrom = monthRange(-2)[0]; S.rTo = monthRange(0)[1]; }
  else { S.rFrom = t.getFullYear() + '-01-01'; S.rTo = t.getFullYear() + '-12-31'; }
  render();
}
/* ปฏิทินเล็กเลือกช่วงวัน */
let RP = null;
function toggleRP(ev){
  ev.stopPropagation();
  if ($('rpPop')) return closeRP();
  RP = {month: S.rFrom.slice(0, 7), a: S.rFrom, b: S.rTo, picking: false};
  const pop = document.createElement('div');
  pop.className = 'rppop'; pop.id = 'rpPop';
  pop.addEventListener('click', e => e.stopPropagation());
  ev.currentTarget.parentNode.appendChild(pop);
  drawRP();
}
function closeRP(){ const p = $('rpPop'); if (p) p.remove(); }
document.addEventListener('click', closeRP);
function drawRP(){
  const pop = $('rpPop'); if (!pop) return;
  const [y, m] = RP.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const duty = new Set(S.data.days.filter(d => !d.cancelled).map(d => d.date));
  let cells = ['จ','อ','พ','พฤ','ศ','ส','อา'].map(x => `<span class="muted">${x}<\/span>`).join('');
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    const k = ymd(d);
    const cls = [d.getMonth() !== m - 1 ? 'o' : '', k >= RP.a && k <= RP.b ? 'in' : '', k === RP.a || k === RP.b ? 'edge' : '', duty.has(k) ? 'du' : ''].join(' ');
    cells += `<button class="${cls}" onclick="rpPick('${k}')">${d.getDate()}<\/button>`;
  }
  pop.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:8px">
      <button class="iconbtn" onclick="rpMove(-1)"><i class="ti ti-chevron-left"><\/i><\/button>
      <b style="font-weight:500">${TH_MON_FULL[m - 1]} ${y}<\/b>
      <button class="iconbtn" onclick="rpMove(1)"><i class="ti ti-chevron-right"><\/i><\/button><\/div>
    <div class="rpcal">${cells}<\/div>
    <div class="muted small" style="margin:10px 2px">${RP.picking ? 'เลือกวันสิ้นสุด' : 'กดวันเริ่มต้น แล้วกดวันสิ้นสุด'}<\/div>
    <div class="row"><span class="small">${fmtShort(RP.a)} – ${fmtShort(RP.b)}<\/span><span class="sp"><\/span>
      <button class="btn sm ghost" onclick="closeRP()">ยกเลิก<\/button><button class="btn sm gold" onclick="rpApply()">ใช้ช่วงนี้<\/button><\/div>`;
}
function rpMove(n){ const [y, m] = RP.month.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); RP.month = d.getFullYear() + '-' + pad(d.getMonth() + 1); drawRP(); }
function rpPick(k){
  if (!RP.picking){ RP.a = k; RP.b = k; RP.picking = true; }
  else { if (k < RP.a){ RP.b = RP.a; RP.a = k; } else RP.b = k; RP.picking = false; }
  drawRP();
}
function rpApply(){ S.rFrom = RP.a; S.rTo = RP.b; closeRP(); render(); }
function exportReport(){
  const rows = reportRows();
  const head = ['วันที่', 'วันหยุด', 'ผู้เข้าเวร', 'เจ้าของเวร', 'ประเภท', 'สแกนเข้า', 'สแกนออก', 'สถานะ', 'เหตุผล', 'บันทึกโดย', 'ที่มาเวลา', 'หมายเหตุวัน'];
  const lines = [head].concat(rows.map(r => [r.d.date, holsOf(r.d.date).map(h => h.name).join(' / '), r.who, r.p.owner, r.type,
    r.p.scan && r.p.scan.in || '', r.p.scan && r.p.scan.out || '', (STATUS[r.p.status] || [''])[0],
    r.p.swap ? r.p.swap.reason : '', r.p.swap ? r.p.swap.by : '', r.p.scan ? r.p.scan.src.join(', ') : '', r.d.note || '']));
  const csv = '﻿' + lines.map(l => l.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = 'สรุปการเข้าเวร_' + S.rFrom + '_' + S.rTo + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- พนักงาน (ผู้ดูแล) ---------- */
const STAFF_SORT = [['nick','ชื่อเล่น'],['code','รหัสพนักงาน'],['name','ชื่อ-นามสกุล'],['username','Username'],['role','สิทธิ์'],['active','สถานะ'],['sheet','ลำดับในชีต']];
function staffList(){
  const q = (S.sQ || '').trim().toLowerCase();
  const f = S.sF || 'all', key = S.sSort || 'code', dir = S.sDir || 1;
  const val = s => key === 'role' ? (s.admin ? 0 : 1) : key === 'active' ? (s.active ? 0 : 1) : String(s[key] || '');
  return S.data.staff.map((s, i) => Object.assign({i}, s))
    .filter(s => !q || [s.nick, s.code, s.name, s.username, s.alias, s.dept].join(' ').toLowerCase().indexOf(q) >= 0)
    .filter(s => f === 'all' || (f === 'on' && s.active) || (f === 'off' && !s.active) || (f === 'noacc' && !(s.username && s.hasPass)) || (f === 'admin' && s.admin))
    .sort((a, b) => {
      if (key === 'sheet') return (a.i - b.i) * dir;
      const x = val(a), y = val(b);
      if (x === '' && y !== '') return 1;
      if (y === '' && x !== '') return -1;

  if (!day.cancelled && (!past || isAdmin())){

/* คนที่ว่างวันนั้น เรียงจากคนเข้าเวรน้อยสุดของปี */
function candidates(date, owner){
  const day = dayOf(date);
  const busy = new Set();
  day.people.forEach(p => { if (p.owner !== owner && p.actual) busy.add(p.actual); });
  const y = date.slice(0, 4);
  const load = {}, last = {};
  S.data.days.forEach(d => {
    if (d.cancelled || d.date.slice(0, 4) !== y) return;
    d.people.forEach(p => { if (p.actual){ load[p.actual] = (load[p.actual] || 0) + 1; if (d.date < date && (!last[p.actual] || d.date > last[p.actual])) last[p.actual] = d.date; } });
  });
  return activeStaff().filter(s => s.nick !== owner && !busy.has(s.nick)).map(s => {
    const gap = last[s.nick] ? daysBetween(last[s.nick], date) : 999;
    return {nick: s.nick, load: load[s.nick] || 0, recent: gap <= 7};
  }).sort((a, b) => a.load - b.load || a.recent - b.recent || a.nick.localeCompare(b.nick, 'th'));
}

    <div class="card" style="background:var(--s2);margin-top:10px"><div style="font-weight:500"><i class="ti ti-fingerprint" style="color:var(--gold2)"><\/i> สแกนนิ้ว (Humansoft)<\/div>
      <div class="muted small" style="margin-top:4px">${d.scanInfo.folder ? 'นำเข้าล่าสุด ' + esc(d.scanInfo.last || '-') + (d.scanInfo.msg ? '<br>' + esc(d.scanInfo.msg) : '') : 'ยังไม่ได้ตั้งโฟลเดอร์ — ใส่ Script property SCAN_FOLDER_ID'}<\/div>
      <button class="btn sm" style="margin-top:10px" id="bScan" onclick="admScan()"><i class="ti ti-download"><\/i>นำเข้าไฟล์สแกนตอนนี้<\/button><\/div>`);
}
function admSync(){
  busyBtn('bSync', true);
  api('syncNow').then(r => { S.data = r.data; toast(`ดึงแพลนแล้ว ${r.sync.days} วัน${r.sync.changed ? '' : ' (ไม่มีการเปลี่ยนแปลง)'}`); closeModal(); })
    .catch(e => { busyBtn('bSync', false); toast(errMsg(e), true); });
}
function admScan(){
  busyBtn('bScan', true);
  api('importScansNow').then(r => { S.data = r.data; toast(r.scan.msg || r.scan.skipped || 'เสร็จแล้ว'); closeModal(); })
    .catch(e => { busyBtn('bScan', false); toast(errMsg(e), true); });
}

load();
</script>
</body>
</html>
