<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2NK เวรวันเสาร์</title>
<meta name="theme-color" content="#1F2340">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F2340; --navy2:#2E3463; --bg:#F3F5F9; --card:#fff; --line:#E3E7EF; --mut:#6B7280; --txt:#1B1F33;
  --ok:#14874B; --okbg:#E6F6EC; --warn:#B26A00; --warnbg:#FFF4DE; --bad:#C0392B; --badbg:#FDECEA;
  --sub:#5B4BC4; --subbg:#EEEBFF; --gray:#8A90A0; --graybg:#F0F2F6; --acc:#E85D75;
  --r:14px; --sh:0 1px 2px rgba(20,25,50,.06),0 4px 14px rgba(20,25,50,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;white-space:nowrap}
.logo b{background:#fff;color:var(--navy);border-radius:8px;padding:2px 7px;font-size:14px;letter-spacing:.5px}
.top .sp{flex:1}
.me{background:rgba(255,255,255,.12);border:0;border-radius:99px;color:#fff;padding:6px 12px;font-size:14px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{background:rgba(255,255,255,.12);border:0;border-radius:99px;color:#fff;width:34px;height:34px;display:grid;place-items:center;font-size:16px}
nav.tabs{display:flex;gap:4px;background:var(--navy);padding:0 12px 8px}
nav.tabs button{flex:1;background:transparent;border:0;color:#C9CDE3;padding:8px 6px;border-radius:10px;font-weight:500;white-space:nowrap}
nav.tabs button.on{background:#fff;color:var(--navy)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 110px}
h2{font-size:17px;margin:18px 2px 10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.hero{border-top:4px solid var(--acc)}
.dayhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.dayhead .d{font-size:20px;font-weight:700}
.dayhead .rel{color:var(--mut);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.t-all{background:#FFE9EE;color:#B0304B}
.t-note{background:var(--graybg);color:#4B5163}
.t-cancel{background:var(--badbg);color:var(--bad)}
.counts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.people{margin-top:10px;display:grid;gap:6px}
.p{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
.p:hover{border-color:#C8CEDD}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--navy2);font-size:14px}
.av.g2{background:#0E7C86}
.av.g0{background:#9A6B1F}
.pn{flex:1;min-width:0}
.pn .n{font-weight:600}
.pn .s{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}
.pn .s s{color:var(--gray)}
.st{flex:none;font-size:12px;font-weight:600;border-radius:99px;padding:3px 9px;white-space:nowrap}
.s-present,.s-sub{background:var(--okbg);color:var(--ok)}
.s-wait{background:var(--warnbg);color:var(--warn)}
.s-future,.s-noscan,.s-cancelled{background:var(--graybg);color:var(--gray)}
.s-open{background:var(--warnbg);color:#C2410C;animation:pulse 1.6s infinite}
.s-absent,.s-subabsent{background:var(--badbg);color:var(--bad)}
@keyframes pulse{50%{opacity:.55}}
.subtag{background:var(--subbg);color:var(--sub);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:600;margin-left:4px}
.mine{outline:2px solid var(--acc);outline-offset:-1px}
.banner{display:flex;gap:10px;align-items:center;background:#FFF0F3;border:1px solid #F7C6D0;border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.banner .t{flex:1}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--navy);color:#fff}
.btn.sec{background:var(--graybg);color:var(--txt)}
.btn.warn{background:var(--acc)}
.btn.ok{background:var(--ok)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;gap:12px}
.mini .p{padding:6px 8px}
.mini .av{width:28px;height:28px;font-size:12px}
.months{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.months button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px}
.months button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12.5px;color:var(--mut);font-weight:600;background:#FAFBFD;position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F8F9FC}
.tablewrap{overflow-x:auto;border-radius:var(--r)}
.num0{color:#C3C7D2}
.hist{display:grid;gap:8px}
.h{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:#fff;box-shadow:var(--sh)}
.h .w{flex:1;min-width:0}
.h .m{font-size:12.5px;color:var(--mut);overflow-wrap:anywhere}
.badge{font-size:11.5px;border-radius:6px;padding:1px 7px;font-weight:600;white-space:nowrap}
.b-done{background:var(--subbg);color:var(--sub)}
.b-open{background:var(--warnbg);color:#C2410C}
.b-cancel,.b-replaced{background:var(--graybg);color:var(--gray)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.foot{color:var(--gray);font-size:12px;text-align:center;margin-top:30px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,18,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet header{padding:14px 16px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:17px;flex:1}
.sheet .body{padding:12px 16px;overflow-y:auto;flex:1}
.sheet footer{padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;border-top:1px solid var(--line)}
.sheet footer .btn{flex:1;padding:12px}
.x{background:var(--graybg);border:0;border-radius:99px;width:32px;height:32px}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.in:focus{outline:2px solid #B9C2EA;border-color:#8E9AD6}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;text-align:left;width:100%}
.opt.on{border-color:var(--navy);background:#F2F4FB}
.opt .c{margin-left:auto;font-size:12px;color:var(--mut);text-align:right}
.warnline{color:var(--warn);font-size:12px}
.search{position:relative}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:8px}
.names button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-weight:600}
.names button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#1B1F33;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;max-width:92vw;box-shadow:var(--sh);font-size:14px}
.toast.err{background:var(--bad)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid #D6DAE6;border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.adm{display:grid;gap:12px}
.kv{font-size:13px;color:var(--mut)}
.staff-tb input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:90px}
.staff-tb td{padding:4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* มือถือ: แท็บล่าง */
@media (max-width:899px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);box-shadow:0 -4px 14px rgba(20,25,50,.06)}
  nav.tabs button{color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;padding:6px 2px}
  nav.tabs button .ic{font-size:19px;line-height:1}
  nav.tabs button.on{background:#EEF0F8;color:var(--navy)}
}
@media (min-width:900px){
  nav.tabs{justify-content:center;padding:0 16px 10px}
  nav.tabs button{flex:none;padding:8px 22px}
  nav.tabs .ic{margin-right:6px}
  .top{padding-left:max(16px,calc(50vw - 574px));padding-right:max(16px,calc(50vw - 574px))}
  .home{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
  .home h2:first-child{margin-top:4px}
  .grid.days{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .ov{align-items:center}
  .sheet{border-radius:18px;max-height:86vh}
}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><b>2NK</b> เวรวันเสาร์</div>
  <div class="sp"></div>
  <button class="me" id="meBtn" onclick="openMe()">เลือกชื่อของคุณ</button>
  <button class="icon-btn" title="ผู้ดูแล" onclick="openAdmin()">⚙</button>
</div>
<nav class="tabs" id="tabs"></nav>
<main id="app"><div class="loading"><div><div class="spin"></div>กำลังโหลด…</div></div></main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxOacNTG4tGdFwtELxqvnEA-kjo1rDqyAWKIXm6z89foVDzj3k6Y1ugJE3Ut9rSFdY/exec";
const PAGE_VERSION = '2026-10-26.2';

/* ---------- ตัวเรียกเซิร์ฟเวอร์ ---------- */
function call(fn, ...args){
  if (window.google && google.script && google.script.run){
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res)
      .withFailureHandler(e => rej(new Error((e && e.message) || e)))[fn](...args));
  }
  if (API_URL){
    return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args})})
      .then(r => r.json()).then(j => { if (j.error) throw new Error(j.error); return j.result; });
  }
  if (window.LOCAL_API){
    return new Promise((res, rej) => setTimeout(() => {
      try { res(JSON.parse(JSON.stringify(window.LOCAL_API[fn](...args)))); } catch(e){ rej(e); }
    }, 120));
  }
  return Promise.reject(new Error('ยังไม่ได้ตั้งค่า API_URL'));
}

/* ---------- สถานะ ---------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem('duty.' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('duty.' + k, JSON.stringify(v)); } catch(e){} }
};
const S = {
  data: null, tab: LS.get('tab', 'home'), me: LS.get('me', ''), pin: LS.get('pin', ''),
  month: '', mineOnly: false, statRange: 'year', person: '', histFilter: 'active',
  admin: (()=>{ try { return sessionStorage.getItem('duty.admin') || ''; } catch(e){ return ''; } })()
};
let DEVICE = LS.get('device', '');
if (!DEVICE){ DEVICE = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); LS.set('device', DEVICE); }

const STATUS = {
  present:  ['มาแล้ว', 's-present'],
  sub:      ['มาแทนแล้ว', 's-sub'],
  wait:     ['รอสแกน', 's-wait'],
  future:   ['รอวันเวร', 's-future'],
  open:     ['หาคนแทน!', 's-open'],
  absent:   ['ขาด', 's-absent'],
  subabsent:['คนแทนไม่มา', 's-subabsent'],
  noscan:   ['ไม่มีข้อมูลสแกน', 's-noscan'],
  cancelled:['ยกเลิกเวร', 's-cancelled']
};

/* ---------- วันที่ ---------- */
const TH_DAY = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const TH_DAY_FULL = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function pd(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s, full){
  const d = pd(s);
  return (full ? 'วัน' + TH_DAY_FULL[d.getDay()] + 'ที่ ' : TH_DAY[d.getDay()] + ' ') + d.getDate() + ' ' + (full ? TH_MON_FULL : TH_MON)[d.getMonth()] + ' ' + d.getFullYear();
}
function daysBetween(a, b){ return Math.round((pd(b) - pd(a)) / 86400000); }
function relDay(s){
  const n = daysBetween(S.data.today, s);
  if (n === 0) return 'วันนี้';
  if (n === 1) return 'พรุ่งนี้';
  if (n > 1) return 'อีก ' + n + ' วัน';
  if (n === -1) return 'เมื่อวาน';
  return n + ' วันก่อน';
}

/* ---------- ตัวช่วย ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), err ? 4500 : 2600);
}
function errMsg(e){
  const m = (e && e.message) || String(e);
  if (m === 'PIN_REQUIRED') return 'PIN ไม่ถูกต้อง';
  return m;
}
function initial(n){ const m = String(n || '').replace(/^พี่/, '').match(/[ก-ฮA-Za-z0-9]/); return esc(m ? m[0].toUpperCase() : '?'); }

/* ---------- โหลดข้อมูล ---------- */
let loading = false;
function load(quiet){
  if (loading) return Promise.resolve();
  loading = true;
  return call('getData', {pin: S.pin}).then(d => {
    S.data = d;
    if (!S.month){ const nx = nextDay(); S.month = (nx ? nx.date : d.today).slice(0, 7); }
    if (!modalOpen()) render();
  }).catch(e => {
    if (errMsg(e) === 'PIN ไม่ถูกต้อง' || (e && e.message === 'PIN_REQUIRED')) return askPin();
    if (!quiet || !S.data) showError(errMsg(e)); else console.warn(e);
  }).finally(() => { loading = false; });
}
function showError(m){
  $('app').innerHTML = `<div class="card empty"><b>โหลดข้อมูลไม่ได้<\/b><br>${esc(m)}<br><br><button class="btn" onclick="load()">ลองใหม่<\/button><\/div>`;
}
setInterval(() => { if (document.visibilityState === 'visible' && !modalOpen()) load(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.data) load(true); });

/* ---------- ข้อมูลที่ใช้บ่อย ---------- */
function upcoming(){ return S.data.days.filter(d => d.date >= S.data.today); }
function nextDay(){ return (S.data.days || []).filter(d => d.date >= S.data.today && !d.cancelled)[0]; }
function myDuties(){
  if (!S.me) return [];
  return upcoming().filter(d => !d.cancelled && d.people.some(p => p.owner === S.me || p.actual === S.me));
}
function activeStaff(){ return S.data.staff.filter(s => s.active); }

/* ---------- แท็บ ---------- */
const TABS = [['home','🏠','หน้าแรก'],['roster','📅','ตารางเวร'],['stats','📊','สรุปรายคน'],['hist','🔁','ประวัติแทน']];
function renderTabs(){
  $('tabs').innerHTML = TABS.map(t => `<button class="${S.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><span class="ic">${t[1]}<\/span>${t[2]}<\/button>`).join('');
}
function go(t){ S.tab = t; LS.set('tab', t); render(); window.scrollTo(0, 0); }

function render(){
  renderTabs();
  $('meBtn').textContent = S.me ? '👤 ' + S.me : 'เลือกชื่อของคุณ';
  if (!S.data) return;
  const v = {home: viewHome, roster: viewRoster, stats: viewStats, hist: viewHist}[S.tab] || viewHome;
  $('app').innerHTML = v() + footer();
}
function footer(){
  const d = S.data;
  const sync = d.lastSync ? new Date(d.lastSync).toLocaleString('th-TH', {dateStyle:'short', timeStyle:'short'}) : '-';
  return `<div class="foot">ดึงแพลนจากไฟล์ต้นฉบับล่าสุด ${esc(sync)} · หน้าเว็บ ${PAGE_VERSION} · เซิร์ฟเวอร์ ${esc(d.version)}${S.admin ? ' · 🔓 โหมดผู้ดูแล' : ''}<\/div>`;
}

/* ---------- การ์ดวันเวร ---------- */
function personRow(day, p){
  const st = STATUS[p.status] || ['', ''];
  const mine = S.me && (p.owner === S.me || p.actual === S.me);
  let name, sub;
  if (p.swap && p.swap.status === 'แทนแล้ว'){
    name = `${esc(p.actual)}<span class="subtag">แทน<\/span>`;
    sub = `เจ้าของเวร <s>${esc(p.owner)}<\/s>${p.swap.reason ? ' · ' + esc(p.swap.reason) : ''}`;
  } else if (p.status === 'open'){
    name = esc(p.owner);
    sub = `แจ้งไม่มา — ยังไม่มีคนแทน${p.swap.reason ? ' · ' + esc(p.swap.reason) : ''}`;
  } else {
    name = esc(p.owner);
    sub = '';
  }
  if (p.scan && p.scan.in) sub += (sub ? ' · ' : '') + `สแกน ${esc(p.scan.in)}${p.scan.out ? '–' + esc(p.scan.out) : ''}`;
  return `<button class="p${mine ? ' mine' : ''}" onclick="openPerson('${day.date}','${esc(p.owner)}')">
    <div class="av${p.group === '2' ? ' g2' : (p.group === '0' ? ' g0' : '')}">${initial(p.actual || p.owner)}<\/div>
    <div class="pn"><div class="n">${name}<\/div>${sub ? `<div class="s">${sub}<\/div>` : ''}<\/div>
    <span class="st ${st[1]}">${st[0]}<\/span><\/button>`;
}
function dayCard(day, opts){
  opts = opts || {};
  const cnt = {};
  day.people.forEach(p => { cnt[p.status] = (cnt[p.status] || 0) + 1; });
  const subs = day.people.filter(p => p.swap && p.swap.status === 'แทนแล้ว').length;
  const open = cnt.open || 0;
  const people = opts.mine && S.me ? day.people.filter(p => p.owner === S.me || p.actual === S.me) : day.people;
  return `<div class="card${opts.hero ? ' hero' : ''}${opts.mini ? ' mini' : ''}">
    <div class="dayhead">
      <div><div class="d">${fmtDate(day.date, opts.hero)}<\/div><div class="rel">${relDay(day.date)} · ${day.people.length} คน${day.dept ? ' · ' + esc(day.dept) : ''}<\/div><\/div>
      <div class="counts">
        ${day.cancelled ? '<span class="tag t-cancel">ยกเลิกเวร<\/span>' : ''}
        ${day.all ? '<span class="tag t-all">เข้าทั้งหมด<\/span>' : ''}

/* ---------- สรุปรายคน ---------- */
function statRange(){
  const t = S.data.today, y = t.slice(0, 4), m = t.slice(0, 7);
  if (S.statRange === 'month') return [m + '-01', m + '-31', 'เดือนนี้'];
  if (S.statRange === 'prev'){ const d = pd(m + '-01'); d.setMonth(d.getMonth() - 1);
    const pm = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); return [pm + '-01', pm + '-31', 'เดือนก่อน']; }
  if (S.statRange === 'all') return ['0000', '9999', 'ทั้งหมด'];
  return [y + '-01-01', y + '-12-31', 'ปี ' + y];
}
function computeStats(from, to){
  const st = {};
  const get = n => st[n] || (st[n] = {nick: n, plan: 0, gave: 0, covered: 0, came: 0, absent: 0, open: 0, nodata: 0, upcoming: 0, rows: []});
  S.data.days.forEach(d => {
    if (d.date < from || d.date > to || d.cancelled) return;
    d.people.forEach(p => {
      const o = get(p.owner);
      o.plan++;
      o.rows.push({d, p, role: p.actual === p.owner ? 'own' : 'gave'});
      if (p.swap && p.swap.status === 'แทนแล้ว') o.gave++;
      if (p.status === 'open') o.open++;
      if (p.actual && p.actual !== p.owner){ const s = get(p.actual); s.covered++; s.rows.push({d, p, role: 'sub'}); }
      if (p.actual){
        const a = get(p.actual);
        if (p.status === 'present' || p.status === 'sub') a.came++;
        else if (p.status === 'absent' || p.status === 'subabsent') a.absent++;
        else if (p.status === 'noscan') a.nodata++;
        else if (p.status === 'future' || p.status === 'wait') a.upcoming++;
      }
    });
  });
  S.data.staff.forEach(s => { if (s.active) get(s.nick); });
  return Object.values(st).sort((a, b) => (b.plan + b.covered) - (a.plan + a.covered) || a.nick.localeCompare(b.nick, 'th'));
}
function viewStats(){

    const r = rows.find(x => x.nick === S.person);

      const ord = r.rows.slice().sort((a, b) => b.d.date.localeCompare(a.d.date));
      detail = `<h2>👤 ${esc(r.nick)} · ${label}<\/h2><div class="hist">${ord.map(x => {
        const st = STATUS[x.p.status] || ['', ''];
        const role = x.role === 'sub' ? `ไปแทน ${esc(x.p.owner)}` : (x.role === 'gave' ? (x.p.actual ? `${esc(x.p.actual)} มาแทน` : 'แจ้งไม่มา') : 'เวรของตัวเอง');
        const shown = x.role === 'gave' ? '' : `<span class="st ${st[1]}" style="animation:none">${st[0]}<\/span>`;
        return `<div class="h"><div class="w"><b>${fmtDate(x.d.date)}<\/b><div class="m">${role}${x.p.scan && x.p.scan.in && x.role !== 'gave' ? ' · สแกน ' + esc(x.p.scan.in) : ''}<\/div><\/div>${shown}<\/div>`;
      }).join('') || '<div class="card empty">ไม่มีรายการ<\/div>'}<\/div>`;
    }
  }
  return `<div class="row" style="justify-content:space-between"><h2>📊 สรุปรายคน · ${label}<\/h2>
      <div class="row">${ranges.map(r => `<button class="btn ${S.statRange === r[0] ? '' : 'sec'}" style="padding:6px 12px" onclick="S.statRange='${r[0]}';render()">${r[1]}<\/button>`).join('')}<\/div><\/div>
    <div class="card" style="padding:0"><div class="tablewrap"><table>
      <thead><tr><th>ชื่อ<\/th><th>เวรตามแพลน<\/th><th>ให้คนอื่นแทน<\/th><th>ไปแทนคนอื่น<\/th><th>มาแล้ว<\/th><th>ขาด<\/th><th>รอวันเวร<\/th><th>ไม่มีข้อมูลสแกน<\/th><\/tr><\/thead>
      <tbody>${rows.map(r => `<tr onclick="S.person='${esc(r.nick)}';render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30)" style="${S.person === r.nick ? 'background:#EEF0F8' : ''}">
        <td><b>${esc(r.nick)}<\/b><\/td><td>${n(r.plan)}<\/td><td>${n(r.gave)}<\/td><td>${n(r.covered)}<\/td>
        <td style="color:var(--ok)">${n(r.came)}<\/td><td style="color:var(--bad)">${n(r.absent)}<\/td><td>${n(r.upcoming)}<\/td><td>${n(r.nodata)}<\/td><\/tr>`).join('')}<\/tbody>
    <\/table><\/div><\/div>
    <div class="kv" style="margin-top:6px">กดที่ชื่อเพื่อดูรายละเอียด · "ขาด" นับเฉพาะวันที่มีข้อมูลสแกนนิ้วแล้วแต่ไม่พบคนนั้น<\/div>

/* คนที่ว่างวันนั้น เรียงจากคนเข้าเวรน้อยสุดของปี */
function candidates(date, owner){
  const day = S.data.days.find(d => d.date === date);
  const busy = new Set();
  day.people.forEach(p => { if (p.owner !== owner && p.actual) busy.add(p.actual); });
  const y = date.slice(0, 4);
  const load = {}, last = {};
  S.data.days.forEach(d => {
    if (d.cancelled || d.date.slice(0, 4) !== y) return;
    d.people.forEach(p => { if (p.actual){ load[p.actual] = (load[p.actual] || 0) + 1; if (d.date < date && (!last[p.actual] || d.date > last[p.actual])) last[p.actual] = d.date; } });
  });
  return activeStaff().filter(s => s.nick !== owner && !busy.has(s.nick)).map(s => {
    const gap = last[s.nick] ? daysBetween(last[s.nick], date) : 999;
    return {nick: s.nick, load: load[s.nick] || 0, recent: gap <= 7};
  }).sort((a, b) => a.load - b.load || a.recent - b.recent || a.nick.localeCompare(b.nick, 'th'));
}

      ${cs.map(c => `<button class="opt${PICK === c.nick ? ' on' : ''}" data-n="${esc(c.nick)}" onclick="pick(this)"><div class="av">${initial(c.nick)}<\/div>
        <div><b>${esc(c.nick)}<\/b>${c.recent ? '<div class="warnline">เพิ่งเข้าเวรสัปดาห์ที่แล้ว<\/div>' : ''}<\/div><div class="c">เวรปีนี้<br><b>${c.load}<\/b> ครั้ง<\/div><\/button>`).join('')}
    <\/div>
    <div class="kv" style="margin-top:10px">บันทึกโดย: <b>${esc(S.me)}<\/b><\/div>`,
    `<button class="btn sec" onclick="closeModal()">ยกเลิก<\/button><button class="btn" id="swSave" onclick="doSwap('${date}','${esc(owner)}')">บันทึก<\/button>`);

function filterCand(){

}

}
function busyBtn(id, on){ const b = $(id); if (b){ b.disabled = on; if (on) b.dataset.t = b.textContent, b.textContent = 'กำลังบันทึก…'; else if (b.dataset.t) b.textContent = b.dataset.t; } }
function doSwap(date, owner){
  busyBtn('swSave', true);
  call('saveSwap', {date, owner, sub: PICK, reason: $('swReason').value, by: S.me, deviceId: DEVICE, pin: S.pin, adminPass: S.admin})
    .then(d => { S.data = d; closeModal(); toast(PICK ? `บันทึกแล้ว: ${PICK} แทน ${owner}` : 'แจ้งหาคนแทนแล้ว'); })
    .catch(e => { busyBtn('swSave', false); toast(errMsg(e), true); });
}

/* รับแทนเวรที่ประกาศไว้ */
function openTake(id){
  if (!S.me){ toast('เลือกชื่อของคุณก่อน', true); return openMe(); }
  let day, p;
  S.data.days.forEach(d => d.people.forEach(x => { if (x.swap && x.swap.id === id){ day = d; p = x; } }));
  if (!p) return;
  const ok = candidates(day.date, p.owner).some(c => c.nick === S.me);
  modal('รับแทนเวร', `<p>คุณ <b>${esc(S.me)}<\/b> จะไปเข้าเวรแทน <b>${esc(p.owner)}<\/b><br>${fmtDate(day.date, true)}<\/p>
    ${ok ? '' : '<div class="warnline">คุณมีเวรวันนั้นอยู่แล้ว หรือไม่อยู่ในรายชื่อที่ใช้งาน<\/div>'}`,
    `<button class="btn sec" onclick="closeModal()">ไม่ใช่ตอนนี้<\/button><button class="btn ok" id="tkSave" ${ok ? '' : 'disabled'} onclick="doTake('${id}')">ยืนยัน ฉันไปแทน<\/button>`);
}
function doTake(id){
  busyBtn('tkSave', true);
  call('takeShift', {id, sub: S.me, by: S.me, deviceId: DEVICE, pin: S.pin, adminPass: S.admin})
    .then(d => { S.data = d; closeModal(); toast('ขอบคุณที่ไปแทน 🙏'); })
    .catch(e => { busyBtn('tkSave', false); toast(errMsg(e), true); });
}
function doCancel(id){
  if (!confirm('ยกเลิกการแทนนี้ และให้เวรกลับเป็นของเจ้าของเวรเดิม?')) return;
  call('cancelSwap', {id, by: S.me || 'ผู้ดูแล', deviceId: DEVICE, pin: S.pin, adminPass: S.admin})
    .then(d => { S.data = d; closeModal(); toast('ยกเลิกแล้ว'); })
    .catch(e => toast(errMsg(e), true));
}

/* PIN ทีม (ถ้าตั้ง TEAM_PIN) */
function askPin(){
  $('app').innerHTML = `<div class="card" style="max-width:360px;margin:40px auto;text-align:center"><h2>🔒 ใส่ PIN ทีม<\/h2>
    <input class="in" id="pinIn" type="password" inputmode="numeric" style="text-align:center;font-size:20px" onkeydown="if(event.key==='Enter')savePin()">
    <button class="btn" style="margin-top:10px;width:100%" onclick="savePin()">เข้าใช้งาน<\/button><\/div>`;
  setTimeout(() => $('pinIn') && $('pinIn').focus(), 50);
}
function savePin(){ S.pin = $('pinIn').value.trim(); LS.set('pin', S.pin); load(); }

/* ---------- ผู้ดูแล ---------- */
function openAdmin(){
  if (!S.data) return;
  if (!S.admin){
    modal('เข้าโหมดผู้ดูแล', `<label class="f">รหัสผู้ดูแล<\/label><input class="in" id="admPass" type="password" onkeydown="if(event.key==='Enter')admLogin()">`,
      `<button class="btn" id="admBtn" onclick="admLogin()">เข้าสู่ระบบ<\/button>`);
    setTimeout(() => $('admPass') && $('admPass').focus(), 50);
    return;
  }
  const d = S.data;
  const staff = d.staff;
  modal('⚙ ผู้ดูแล', `<div class="adm">
    <div class="card" style="box-shadow:none;border:1px solid var(--line)"><b>แพลนเวร<\/b>
      <div class="kv">ดึงจากไฟล์ต้นฉบับ "แพลนเข้าทำงานในวันเสาร์" (อ่านอย่างเดียว) ทุก 15 นาที และทุกครั้งที่เปิดแอป<\/div>
      <button class="btn sec" style="margin-top:8px" id="bSync" onclick="admSync()">🔄 ดึงแพลนตอนนี้<\/button><\/div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line)"><b>สแกนนิ้ว (Humansoft)<\/b>
      <div class="kv">${d.scanInfo.folder ? 'นำเข้าล่าสุด ' + esc(d.scanInfo.last || '-') + (d.scanInfo.msg ? '<br>' + esc(d.scanInfo.msg) : '') : 'ยังไม่ได้ตั้งโฟลเดอร์ — ใส่ Script property SCAN_FOLDER_ID'}<\/div>
      <button class="btn sec" style="margin-top:8px" id="bScan" onclick="admScan()">📥 นำเข้าไฟล์สแกนตอนนี้<\/button><\/div>
    <div><b>พนักงาน<\/b> <span class="kv">— ใส่รหัสและชื่อ-นามสกุลให้ตรงกับ Humansoft<\/span>
      <div class="tablewrap" style="margin-top:6px"><table class="staff-tb"><thead><tr><th>ชื่อเล่น<\/th><th>รหัส<\/th><th>ชื่อ-นามสกุล<\/th><th>ใช้งาน<\/th><\/tr><\/thead><tbody>
      ${staff.map((s, i) => `<tr style="cursor:default"><td><b>${esc(s.nick)}<\/b><\/td>
        <td><input data-i="${i}" data-k="code" value="${esc(s.code)}" placeholder="รหัส"><\/td>
        <td><input data-i="${i}" data-k="name" value="${esc(s.name)}" placeholder="ชื่อ-นามสกุล" style="min-width:160px"><\/td>
        <td><input type="checkbox" data-i="${i}" data-k="active" ${s.active ? 'checked' : ''} style="width:auto"><\/td><\/tr>`).join('')}
      <\/tbody><\/table><\/div>
      <div class="row" style="margin-top:8px"><input class="in" id="newNick" placeholder="เพิ่มพนักงาน (ชื่อเล่น)" style="flex:1;min-width:160px"><\/div><\/div>
  <\/div>`, `<button class="btn sec" onclick="admLogout()">ออกจากโหมดผู้ดูแล<\/button><button class="btn" id="bStaff" onclick="admSaveStaff()">บันทึกพนักงาน<\/button>`);
}
function admLogin(){
  const p = $('admPass').value;
  busyBtn('admBtn', true);
  call('adminLogin', p).then(() => {
    S.admin = p; try { sessionStorage.setItem('duty.admin', p); } catch(e){}
    closeModal(); openAdmin();
  }).catch(e => { busyBtn('admBtn', false); toast(errMsg(e), true); });
}
function admLogout(){ S.admin = ''; try { sessionStorage.removeItem('duty.admin'); } catch(e){} closeModal(); }
function admSync(){
  busyBtn('bSync', true);
  call('syncNow', S.admin).then(r => { S.data = r.data; toast(`ดึงแพลนแล้ว ${r.sync.days} วัน${r.sync.changed ? '' : ' (ไม่มีการเปลี่ยนแปลง)'}`); closeModal(); openAdmin(); })
    .catch(e => { busyBtn('bSync', false); toast(errMsg(e), true); });
}
function admScan(){
  busyBtn('bScan', true);
  call('importScansNow', S.admin).then(r => { S.data = r.data; toast(r.scan.skipped && !r.scan.msg ? r.scan.skipped : r.scan.msg); closeModal(); openAdmin(); })
    .catch(e => { busyBtn('bScan', false); toast(errMsg(e), true); });
}
function admSaveStaff(){
  const list = S.data.staff.map(s => ({nick: s.nick}));
  document.querySelectorAll('.staff-tb [data-i]').forEach(el => {
    list[+el.dataset.i][el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
  });
  const nn = $('newNick').value.trim();
  if (nn) list.push({nick: nn, active: true});
  busyBtn('bStaff', true);
  call('saveStaff', S.admin, list).then(d => { S.data = d; toast('บันทึกพนักงานแล้ว'); closeModal(); })
    .catch(e => { busyBtn('bStaff', false); toast(errMsg(e), true); });
}
function markAtt(date, nick, clear){
  call('markAttendance', S.admin, {date, nick, in: $('mIn') ? $('mIn').value : '', out: $('mOut') ? $('mOut').value : '', clear: !!clear})
    .then(d => { S.data = d; closeModal(); toast(clear ? 'ลบแล้ว' : 'บันทึกว่ามาแล้ว'); })
    .catch(e => toast(errMsg(e), true));
}

renderTabs();
load();
</script>
</body>
</html>
